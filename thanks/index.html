<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you</title>
<link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="../favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root { --ink: #2b2620; --quiet: #6d6458; --rule: #ded5c6; --paper: #f4efe4; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #e7e0d3; --quiet: #a19684; --rule: #38322a; --paper: #17150f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 3rem 1.25rem 5rem;
    background: var(--paper); color: var(--ink);
    font: 17px/1.65 Charter, "Bitstream Charter", "Iowan Old Style", Georgia, serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 1rem; }
  p { margin: 0 0 1.1rem; }
  .quiet { color: var(--quiet); }
  a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 2px; }
  a:hover { text-decoration-style: dotted; }
</style>
</head>
<body>
<main>
  <h1>Thank you</h1>
  <p>Your gift goes straight to the llamas. They are grateful, and so am I.</p>
  <p lang="ja" class="quiet">ありがとう。贈りものは、そのままラマたちのもとへ届きます。</p>
  <p><a href="https://wanderthe.dev/">wander 彷徨う</a></p>
</main>
</body>
</html>
