<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you</title>
<link rel="icon" href="../favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" href="../favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<script>try { var t = localStorage.getItem('theme'); if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<link rel="preload" href="../fonts/DepartureMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/GeistMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
  :root { --ink: #252422; --quiet: #52504c; --rule: #c1bfb8; --paper: #d9d8d3; --raise: #e2e1dc; --line: #83817b; --hard: rgba(30, 30, 28, .2); color-scheme: light; }
  /* Dark follows the computer or phone, unless the button in the corner has been pressed (theme.js). */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #dddcd7; --quiet: #a4a39d; --rule: #3d3d3a; --paper: #222221; --raise: #2a2a28; --line: #76756f; --hard: rgba(0, 0, 0, .5); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --ink: #dddcd7; --quiet: #a4a39d; --rule: #3d3d3a; --paper: #222221; --raise: #2a2a28; --line: #76756f; --hard: rgba(0, 0, 0, .5); color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 3rem 1.25rem 5rem;
    background: var(--paper); color: var(--ink);
    font: 17px/1.65 Charter, "Bitstream Charter", "Iowan Old Style", Georgia, serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 34rem; margin: 0 auto; }
  /* the thanks on a raised card, as Home's and Wander's are on the home page */
  main { background: var(--raise); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 6px 6px 0 var(--hard);
    padding: 1.5rem 1.6rem 1.4rem; }
  main p:last-child { margin: 1.4rem 0 0; }
  @media (max-width: 40rem) { body { padding-top: 4.25rem; } }   /* the card clear of the light/dark button in the corner */
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 1rem; }
  p { margin: 0 0 1.1rem; }
  .quiet { color: var(--quiet); }
  a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 2px; text-decoration-color: var(--line); }
  a:hover { text-decoration-style: dotted; text-decoration-color: currentColor; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  /* the way back as a button, as the home page's are: pressed, it goes down into its shadow */
  main p:last-child a { display: inline-block; color: var(--ink); text-decoration: none; background: var(--raise);
    border: 2px solid var(--ink); padding: 0.4rem 0.95rem; box-shadow: 3px 3px 0 var(--ink); line-height: 1.3; }
  main p:last-child a:hover { background: var(--paper); }
  main p:last-child a:active { transform: translate(3px, 3px); box-shadow: none; }
  /* Light or dark, in the corner. */
  button.theme { position: fixed; top: calc(0.9rem + env(safe-area-inset-top, 0px)); right: calc(1rem + env(safe-area-inset-right, 0px));
    width: 2.25rem; height: 2.25rem; z-index: 50; padding: 0.45rem; cursor: pointer; color: var(--quiet);
    background: var(--paper); border: 1px solid var(--rule); border-radius: 50%; }   /* stays in the corner as the page scrolls, on a small disc of paper so it reads over pictures */
  @media (min-width: calc(544px + 8rem)) {   /* with a margin to sit in: a little way out from the column (halfway between beside it and mid-margin), an inch down */
    button.theme { top: 6rem; right: calc((100vw - 544px) * 7 / 16 - 2.6875rem); }   /* between beside the column and where it was a smidge out */
  }
  button.theme:hover { color: var(--ink); }
  button.theme svg { display: block; width: 100%; height: 100%; }
  button.theme[aria-pressed="true"] .moon, button.theme:not([aria-pressed="true"]) .sun { display: none; }

  /* ===== Pixel and E Ink (2026-11-20, as the home page): E Ink grey by day and charcoal by night; labels in Departure Mono
     (Helena Zhang, SIL OFL 1.1), running text in Geist Mono (Vercel, SIL OFL 1.1), from ../fonts/; square corners, shadows
     in two hard steps, dotted pixel rules, hovers that fill in two steps. ===== */
  @font-face { font-family: "Departure Mono"; src: url(../fonts/DepartureMono-Regular.woff2) format("woff2"); font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url(../fonts/GeistMono-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url(../fonts/GeistMono-SemiBold.woff2) format("woff2"); font-weight: 600 700; font-display: swap; }
  :root { --pixel: "Departure Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace;
    --step: 2px 2px 0 var(--ink), 4px 4px 0 var(--ink);
    --step-soft: 3px 3px 0 var(--hard), 6px 6px 0 var(--hard); }
  body { font: 15px/1.7 "Geist Mono", ui-monospace, Menlo, Consolas, "Liberation Mono", monospace; }
  h1 { font-family: var(--pixel); font-weight: 400; letter-spacing: 0; font-size: 33px; line-height: 1.15; }   /* sharpest at 11, 22 and 33px */
  button.theme { border-radius: 0; border-width: 2px; }
  @keyframes px-fill { 0% { background: repeating-conic-gradient(var(--ink) 0 25%, transparent 0 50%) 0 0 / 4px 4px; color: var(--ink); } }
  main { border-radius: 0; border-width: 2px; box-shadow: var(--step-soft); }
  main p:last-child a { font-family: var(--pixel); box-shadow: var(--step); }
  main p:last-child a:active { transform: translate(4px, 4px); }
  main p:last-child a:hover { background: var(--ink); color: var(--paper); }
  @media (prefers-reduced-motion: no-preference) { main p:last-child a:hover { animation: px-fill .12s step-end both; } }
</style>
</head>
<body>
<button type="button" class="theme" aria-pressed="false" aria-label="Dark mode" title="Dark mode"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></g></svg></button>
<main>
  <h1>Thank you</h1>
  <p>Your gift goes straight to the llamas. They are grateful, and so am I.</p>
  <p><a href="https://wanderthe.dev/">wander</a></p>
</main>
<script src="../theme.js"></script>
<script src="../paging.js"></script>
</body>
</html>
