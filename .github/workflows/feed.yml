# Rebuild feed.xml from the apps' public releases, so the feed keeps up without a release step.
# It only reads releases; it never builds or publishes an app.
name: feed

on:
  schedule:
    - cron: "17 */3 * * *"   # every three hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build feed.xml
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 _tools/make-feed.py
      - name: Commit if it changed
        run: |
          git diff --quiet -- feed.xml && { echo "feed unchanged"; exit 0; }
          git config user.name "wander wildwood"
          git config user.email "wanderwildwood@users.noreply.github.com"
          git add feed.xml
          git commit -m "Feed: new releases"
          git push
